    <radialGradient id="mtn-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe6a6" stop-opacity="0"/>
    </radialGradient>
  </defs>


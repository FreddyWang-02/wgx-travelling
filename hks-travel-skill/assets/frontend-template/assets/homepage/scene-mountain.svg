<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="山野湖泊风景插画" preserveAspectRatio="xMidYMid slice">
  <title>Mountain scene</title>
  <defs>
    <linearGradient id="mtn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--scene-sky-1, #d6e8f6)"/>
      <stop offset=".58" stop-color="var(--scene-sky-2, #f7e7d4)"/>
      <stop offset="1" stop-color="var(--scene-sky-3, #ffe0b6)"/>
